<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Café</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container nav-wrap">
            <a class="logo" href="index.html">Café</a>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="gallery.html" class="active">Gallery</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero small-hero">
            <div class="container">
                <p class="eyebrow">Gallery</p>
                <h1>A look inside our café.</h1>
                <p>Replace the sample image URLs below with your team's own café images later.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="gallery-grid">
                    <figure class="gallery-item">
                        <img src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=900&q=80" alt="Coffee shop interior">
                        <figcaption>Comfortable café space</figcaption>
                    </figure>

                    <figure class="gallery-item">
                        <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=80" alt="Cup of coffee">
                        <figcaption>Freshly brewed coffee</figcaption>
                    </figure>

                    <figure class="gallery-item">
                        <img src="https://images.unsplash.com/photo-1511081692775-05d0f180a065?auto=format&fit=crop&w=900&q=80" alt="Coffee preparation">
                        <figcaption>Prepared with care</figcaption>
                    </figure>

                    <figure class="gallery-item">
                        <img src="https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=900&q=80" alt="Cafe table and chairs">
                        <figcaption>Space to relax</figcaption>
                    </figure>

                    <figure class="gallery-item">
                        <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=900&q=80" alt="Coffee cup on table">
                        <figcaption>Your daily coffee break</figcaption>
                    </figure>

                    <figure class="gallery-item">
                        <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=900&q=80" alt="Modern cafe interior">
                        <figcaption>A welcoming atmosphere</figcaption>
                    </figure>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="year"></span> Café. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
